events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Upstream service definitions
    upstream catalog_backend {
        server catalog-service:8001;
        keepalive 32;
    }

    upstream order_backend {
        server order-service:8002;
        keepalive 32;
    }

    upstream payment_backend {
        server payment-service:8003;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Security & CORS Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Idempotency-Key" always;

        # Preflight handling
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Gateway Status
        location /gateway/health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx-reverse-proxy","version":"1.25.0","timestamp":"$time_iso8601"}';
        }

        # Route /api/catalog/ -> Catalog Service
        location /api/catalog/ {
            rewrite ^/api/catalog/(.*) /$1 break;
            proxy_pass http://catalog_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # Route /api/orders/ -> Order Service
        location /api/orders/ {
            rewrite ^/api/orders/(.*) /$1 break;
            proxy_pass http://order_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # Route /api/payments/ -> Payment Service
        location /api/payments/ {
            rewrite ^/api/payments/(.*) /$1 break;
            proxy_pass http://payment_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # Frontend static files (when deployed with Nginx)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
