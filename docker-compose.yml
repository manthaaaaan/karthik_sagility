version: "3.8"

networks:
  sagility-net:
    driver: bridge

volumes:
  catalog_data:
  order_data:
  payment_data:

services:
  catalog-service:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: sagility-catalog
    ports:
      - "8001:8001"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - catalog_data:/app/data
    networks:
      - sagility-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: sagility-order
    ports:
      - "8002:8002"
    environment:
      - DATA_DIR=/app/data
      - CATALOG_SERVICE_URL=http://catalog-service:8001
    volumes:
      - order_data:/app/data
    networks:
      - sagility-net
    depends_on:
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: sagility-payment
    ports:
      - "8003:8003"
    environment:
      - DATA_DIR=/app/data
      - ORDER_SERVICE_URL=http://order-service:8002
    volumes:
      - payment_data:/app/data
    networks:
      - sagility-net
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  api-gateway:
    image: nginx:1.25-alpine
    container_name: sagility-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sagility-net
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped
